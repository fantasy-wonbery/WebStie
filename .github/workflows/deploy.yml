name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master', 'claude/*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Avinect)
        run: npm ci

      - name: Build Avinect site
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Install dependencies (Wonbery)
        working-directory: wonbery-site
        run: npm ci

      - name: Build Wonbery site
        working-directory: wonbery-site
        run: npm run build

      - name: Copy Wonbery dist to main dist/wonbery
        run: |
          mkdir -p dist/wonbery
          cp -r wonbery-site/dist/* dist/wonbery/
          cp dist/wonbery/index.html dist/wonbery/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
